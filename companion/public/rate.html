<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV Maison">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/pwa/manifest.webmanifest">
<link rel="apple-touch-icon" href="/pwa/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png">
<title>TV Maison</title>
<style>
  :root { --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --card3: #3a3a3c; --text: #f5f5f7; --dim: rgba(235,235,245,.6); --dim2: rgba(235,235,245,.35);
    --line: rgba(84,84,88,.45); --accent: #0a84ff; --on-accent: #fff;
    --like: #30d158; --neutral: #ff9f0a; --want: #0a84ff; --pass: #ff453a; --unseen: #bf5af2;
    --tabs: calc(58px + env(safe-area-inset-bottom)); --top: env(safe-area-inset-top); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  input { font: inherit; color: inherit; }
  img { display: block; }
  svg { display: block; }
  [hidden] { display: none !important; }

  /* ---------- Shell ---------- */
  .view { display: none; max-width: 680px; margin: 0 auto; padding: calc(var(--top) + 8px) 16px calc(var(--tabs) + 24px); min-height: 100vh; }
  .view.on { display: block; }
  .title { display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 0 14px; min-height: 64px; }
  .title h1 { font-size: 32px; font-weight: 800; letter-spacing: -.6px; line-height: 1.05; }
  .title p { color: var(--dim); font-size: 14px; margin-top: 3px; }
  .round { width: 38px; height: 38px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; flex: none; transition: transform .15s, opacity .2s; }
  .round:active { transform: scale(.9); }
  .round:disabled { opacity: .3; }
  .round svg { width: 19px; height: 19px; }

  #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: var(--tabs); padding-bottom: env(safe-area-inset-bottom);
    display: flex; justify-content: center; background: rgba(18,18,20,.82); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--line); }
  #tabs button { flex: 1; max-width: 136px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim2); font-size: 10.5px; font-weight: 600; letter-spacing: .1px; }
  #tabs svg { width: 25px; height: 25px; margin-bottom: 3px; }
  #tabs button.on { color: var(--accent); }

  #toast { position: fixed; left: 50%; bottom: calc(var(--tabs) + 14px); z-index: 40; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; max-width: calc(100% - 32px); background: rgba(58,58,60,.96); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 14px; padding: 11px 8px 11px 16px; font-size: 15px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: transform .25s, opacity .25s; }
  #toast.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  #toast i { width: 9px; height: 9px; border-radius: 50%; margin-right: 10px; flex: none; }
  #toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 8px; }
  #toast button { color: var(--accent); font-weight: 700; padding: 0 8px; white-space: nowrap; }
  body.sheet-open #toast { bottom: calc(14px + env(safe-area-inset-bottom)); }
  /* On Discover the buttons sit at the bottom: the toast goes to the top instead */
  body[data-tab=rate]:not(.sheet-open) #toast { bottom: auto; top: calc(var(--top) + 12px); transform: translate(-50%, -20px); }
  body[data-tab=rate]:not(.sheet-open) #toast.on { transform: translate(-50%, 0); }

  .empty { text-align: center; color: var(--dim); padding: 60px 24px; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  .spin { width: 28px; height: 28px; margin: 50px auto; border-radius: 50%; border: 3px solid var(--card2); border-top-color: var(--dim); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sec { font-size: 20px; font-weight: 700; letter-spacing: -.3px; margin: 26px 0 10px; }
  .sec small { font-size: 14px; color: var(--dim); font-weight: 500; margin-left: 6px; letter-spacing: 0; }

  /* Segmented control and chips */
  .segm { display: flex; background: var(--card); border-radius: 10px; padding: 2px; margin-bottom: 14px; }
  .segm button { flex: 1; padding: 7px 0; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--dim); transition: background .2s, color .2s; }
  .segm button.on { background: var(--card3); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .chips { display: flex; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: flex; align-items: center; background: var(--card); color: var(--text); font-size: 14px; font-weight: 600; padding: 8px 14px; margin-right: 8px; border-radius: 18px; white-space: nowrap; transition: background .2s, color .2s; }
  .chip .d { width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
  .chip small { color: var(--dim); font-weight: 500; margin-left: 6px; }
  .chip.on { background: var(--text); color: #000; }
  .chip.on small { color: rgba(0,0,0,.55); }
  .chip img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; margin: -4px 8px -4px -8px; background: var(--card2); }

  /* ---------- Discover ---------- */
  #v-rate.on { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 0; padding-bottom: calc(var(--tabs) + 10px); }
  #deckwrap { flex: 1; min-height: 0; display: flex; justify-content: center; padding-bottom: 30px; } /* room for the cards stacked behind */
  #deck { position: relative; height: 100%; aspect-ratio: 2 / 3; max-width: 100%; user-select: none; -webkit-user-select: none; cursor: pointer; }
  .card { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 22px; overflow: hidden; background: var(--card) center / cover no-repeat;
    box-shadow: 0 18px 40px rgba(0,0,0,.55); will-change: transform; transform-origin: 50% 90%; }
  .card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 52%; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.6) 45%, rgba(0,0,0,.94)); pointer-events: none; }
  .card .info { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 1; pointer-events: none; }
  .card h2 { font-size: 27px; font-weight: 800; line-height: 1.08; letter-spacing: -.4px; }
  .card .meta { color: rgba(255,255,255,.75); font-size: 14px; margin-top: 5px; }
  .card .ov { color: rgba(255,255,255,.62); font-size: 13.5px; line-height: 1.4; margin-top: 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .prov { position: absolute; top: 14px; left: 14px; z-index: 1; display: flex; align-items: center; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 12px; font-weight: 700; padding: 5px 10px 5px 8px; border-radius: 12px; }
  .card .prov i { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .card .infob { position: absolute; top: 12px; right: 12px; z-index: 2; width: 34px; height: 34px; background: rgba(0,0,0,.55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .card .infob svg { width: 18px; height: 18px; }
  .stamp { position: absolute; z-index: 3; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-8deg); padding: 8px 16px; border: 4px solid; border-radius: 12px;
    font-size: 30px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; opacity: 0; background: rgba(0,0,0,.35); white-space: nowrap; pointer-events: none; }
  .card.back { pointer-events: none; }
  #actions { display: flex; justify-content: center; align-items: flex-end; padding: 18px 0 4px; }
  #actions button { display: flex; flex-direction: column; align-items: center; margin: 0 6px; color: var(--dim); font-size: 11.5px; font-weight: 600; }
  #actions .ic { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--card); margin-bottom: 6px; transition: transform .15s; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #actions .big .ic { width: 64px; height: 64px; } #actions .small .ic { width: 50px; height: 50px; }
  #actions .big svg { width: 29px; height: 29px; } #actions .small svg { width: 22px; height: 22px; }
  #actions button:active .ic { transform: scale(.88); }
  .c-pass { color: var(--pass); } .c-unseen { color: var(--unseen); } .c-neutral { color: var(--neutral); } .c-want { color: var(--want); } .c-like { color: var(--like); }
  #deck .empty, #deck .spin { position: absolute; top: 35%; left: 0; right: 0; }
  .notice { background: var(--card); border-radius: 16px; padding: 20px; color: var(--dim); margin-top: 30px; }
  .notice b { color: var(--text); display: block; margin-bottom: 4px; }

  /* ---------- TV remote ---------- */
  .now { position: relative; display: flex; align-items: center; background: var(--card) center / cover no-repeat; border-radius: 18px; overflow: hidden; min-height: 96px; padding: 14px; cursor: pointer; }
  .now.img::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, rgba(0,0,0,.92) 30%, rgba(0,0,0,.45)); }
  .now > * { position: relative; }
  .now .t { flex: 1; min-width: 0; margin-left: 14px; }
  .now .k { color: var(--dim); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
  .now b { display: block; font-size: 18px; font-weight: 700; line-height: 1.2; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .now small { display: block; color: var(--dim); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .apptile { width: 96px; height: 60px; padding-top: 0; border-radius: 12px; flex: none; }
  .now.off { flex-direction: column; align-items: stretch; text-align: center; padding: 22px 18px; cursor: default; }
  .now.off b { font-size: 20px; }
  .now.off p { color: var(--dim); font-size: 13.5px; margin: 4px 0 16px; }
  .bigbtn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; transition: transform .15s; }
  .bigbtn:active { transform: scale(.97); }
  .bigbtn svg { width: 19px; height: 19px; margin-right: 8px; }
  /* Live view of the TV screen (captures from the TV, refreshed as fast as it gives them) */
  .screen { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 18px; overflow: hidden; margin-bottom: 14px; cursor: zoom-in; }
  .screen img { width: 100%; height: 100%; object-fit: contain; }
  .screen .tag { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; background: rgba(0,0,0,.6); border-radius: 8px;
    padding: 3px 8px; font-size: 11px; font-weight: 700; letter-spacing: .5px; }
  .screen .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); margin-right: 6px; }
  .screen.stale .tag i { background: var(--dim2); }
  .screen .msg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 14px; }
  #screenfs { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; background: #000; display: flex; align-items: center; justify-content: center; }
  #screenfs img { width: 100%; height: 100%; object-fit: contain; }
  /* Phone held upright and orientation not lockable: turn the picture sideways */
  @media (orientation: portrait) { #screenfs img { width: 100vh; height: 100vw; flex: none; transform: rotate(90deg); } }
  #screenfs .fsclose { position: absolute; top: calc(var(--top) + 12px); right: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(40,40,42,.8);
    display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .remote { background: var(--card); border-radius: 22px; padding: 12px 14px 14px; margin-bottom: 14px; -webkit-user-select: none; user-select: none; }
  .remote.dis { opacity: .4; pointer-events: none; }
  .rtop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .rtop .hint { flex: 1; text-align: center; font-size: 12px; color: var(--dim); padding: 0 8px; }
  .rrow { display: flex; align-items: stretch; justify-content: space-between; }
  .rbar { display: flex; justify-content: space-between; margin-top: 14px; }
  .key.sm i { width: 40px; height: 40px; margin: 0; }
  .key.sm svg { width: 19px; height: 19px; }
  /* D-pad: four wedges around OK, as on a real remote */
  .remote .rocker { width: 62px; }
  .dpad { position: relative; width: 196px; height: 196px; flex: none; border-radius: 50%; background: var(--card2); touch-action: manipulation; transition: opacity .2s; }
  .dpad.dis { opacity: .35; }
  .dpad .dp { position: absolute; display: flex; align-items: center; justify-content: center; width: 66px; height: 66px; color: var(--text); border-radius: 50%; transition: background .12s, transform .12s; }
  .dpad .dp svg { width: 26px; height: 26px; }
  .dpad .dp.up { top: 2px; left: 65px; } .dpad .dp.down { bottom: 2px; left: 65px; }
  .dpad .dp.left { left: 2px; top: 65px; } .dpad .dp.right { right: 2px; top: 65px; }
  .dpad .dp.press { background: var(--card3); transform: scale(.92); }
  .dpad .ok { position: absolute; top: 54px; left: 54px; width: 88px; height: 88px; border-radius: 50%; background: var(--card3); font-size: 17px; font-weight: 800;
    letter-spacing: .5px; box-shadow: 0 2px 10px rgba(0,0,0,.35); transition: transform .12s, background .12s; }
  .dpad .ok:active { transform: scale(.93); background: var(--accent); color: var(--on-accent); }
  .rocker { touch-action: manipulation; }
  .rocker button.press { background: var(--card3); }
  /* Remote over the full-screen picture (landscape): tap the picture to show / hide it */
  .fsctl { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; opacity: 0; transition: opacity .25s; }
  #screenfs.ctl .fsctl { opacity: 1; }
  #screenfs.ctl .fsctl > * { pointer-events: auto; }
  .fsctl .rocker { position: absolute; left: calc(env(safe-area-inset-left) + 14px); top: 50%; transform: translateY(-50%); height: 220px; width: 64px; background: rgba(44,44,46,.82); }
  .fsctl .rocker button { min-height: 0; }
  .fsctl .side { position: absolute; right: calc(env(safe-area-inset-right) + 14px); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; }
  .fsctl .dpad { width: 168px; height: 168px; background: rgba(44,44,46,.82); }
  .fsctl .dpad .dp { width: 58px; height: 58px; } .fsctl .dpad .dp svg { width: 22px; height: 22px; }
  .fsctl .dpad .dp.up, .fsctl .dpad .dp.down { left: 55px; } .fsctl .dpad .dp.left, .fsctl .dpad .dp.right { top: 55px; }
  .fsctl .dpad .ok { top: 47px; left: 47px; width: 74px; height: 74px; font-size: 15px; background: rgba(72,72,74,.9); }
  .fsctl .row { display: flex; margin-top: 10px; }
  .fsctl .row .key { margin: 0 5px; } .fsctl .row .key i { width: 44px; height: 44px; margin: 0; background: rgba(44,44,46,.82); }
  @media (orientation: portrait) { .fsctl { display: none; } }
  body.fs #toast { z-index: 60; bottom: calc(14px + env(safe-area-inset-bottom)); }
  .rocker { width: 76px; display: flex; flex-direction: column; align-items: center; background: var(--card2); border-radius: 38px; overflow: hidden; }
  .rocker button { flex: 1; width: 100%; min-height: 64px; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .rocker button:active { background: var(--card3); }
  .rocker svg { width: 24px; height: 24px; }
  .rocker span { font-size: 11px; font-weight: 800; letter-spacing: .8px; color: var(--dim); padding: 4px 0; }
  .rocker em { font-style: normal; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
  .rmid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-gap: 12px; align-content: center; justify-items: center; padding: 0 12px; }
  .key { display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 600; color: var(--dim); }
  .key i { width: 58px; height: 58px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; margin-bottom: 5px; color: var(--text); transition: transform .15s, background .2s, color .2s; }
  .key:active i { transform: scale(.9); }
  .key svg { width: 23px; height: 23px; }
  .key.on i { background: var(--pass); color: #fff; }
  .key.power i { color: var(--pass); }
  #apps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-gap: 12px 10px; }
  .app { display: flex; flex-direction: column; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--dim); min-width: 0; }
  .apptile { position: relative; width: 100%; padding-top: 58%; border-radius: 13px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06); transition: transform .15s; }
  .app:active .apptile { transform: scale(.95); }
  .apptile > * { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .apptile .word { font-weight: 800; letter-spacing: -.5px; white-space: nowrap; }
  .app.cur .apptile { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
  .app > span { margin-top: 6px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srcs { display: flex; flex-wrap: wrap; margin-top: 4px; }
  .srcs .chip { margin-bottom: 8px; }
  .srcs .chip.cur { box-shadow: inset 0 0 0 2px var(--accent); }

  /* ---------- Rows (search, browse) ---------- */
  .row { display: flex; padding: 10px 0; border-bottom: .5px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .pst { width: 62px; height: 93px; border-radius: 9px; object-fit: cover; background: var(--card); flex: none; }
  .row .t { flex: 1; min-width: 0; margin-left: 13px; display: flex; flex-direction: column; justify-content: center; }
  .row .t b { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { color: var(--dim); font-size: 13.5px; margin-top: 1px; }
  .vbar { display: flex; margin-top: 9px; }
  .vbar button { width: 36px; height: 36px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; margin-right: 8px; color: var(--dim2); transition: background .2s, color .2s, transform .15s; }
  .vbar button svg { width: 17px; height: 17px; }
  .vbar button:active { transform: scale(.88); }
  .vbar button.on-pass { background: var(--pass); color: #fff; } .vbar button.on-unseen { background: var(--unseen); color: #fff; }
  .vbar button.on-neutral { background: var(--neutral); color: #000; } .vbar button.on-want { background: var(--want); color: #fff; } .vbar button.on-like { background: var(--like); color: #000; }

  /* ---------- Search ---------- */
  .sbox { position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: calc(var(--top) + 8px) 16px 10px; background: rgba(0,0,0,.85); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  #v-search { padding-top: 0; }
  #v-search .title { padding-top: calc(var(--top) + 18px); }
  .field { display: flex; align-items: center; background: var(--card); border-radius: 12px; padding: 0 10px; }
  .field svg { width: 18px; height: 18px; color: var(--dim); flex: none; }
  .field input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 17px; padding: 11px 8px; }
  .field input::placeholder { color: var(--dim2); }
  .field input::-webkit-search-cancel-button { display: none; }
  .field .x { width: 22px; height: 22px; border-radius: 50%; background: var(--dim2); color: #000; display: flex; align-items: center; justify-content: center; flex: none; }
  .field .x svg { width: 11px; height: 11px; color: #000; }
  #genres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-gap: 10px; }
  .gtile { position: relative; height: 84px; border-radius: 14px; overflow: hidden; text-align: left; padding: 12px 14px; display: flex; align-items: flex-end; font-size: 17px; font-weight: 800; letter-spacing: -.2px; color: #fff; transition: transform .15s; }
  .gtile:active { transform: scale(.97); }
  .gtile span { position: relative; z-index: 1; text-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .gtile em { position: absolute; right: -8px; top: -10px; font-size: 54px; font-style: normal; opacity: .9; transform: rotate(14deg); }
  .bhead { display: flex; align-items: center; padding: 6px 0 12px; }
  .bhead b { font-size: 22px; font-weight: 800; margin-left: 12px; letter-spacing: -.3px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sentinel { height: 1px; }

  /* ---------- My ratings ---------- */
  .field.small { margin-bottom: 12px; }
  .field.small input { font-size: 16px; padding: 9px 8px; }
  #grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-gap: 10px; }
  .tile { position: relative; text-align: left; min-width: 0; }
  .tile .p { position: relative; width: 100%; padding-top: 150%; border-radius: 10px; background: var(--card) center / cover no-repeat; overflow: hidden; }

async function fill() {

    const r = await api('/api/rate/queue?page=' + page);

// ---------- TV guide and reminders ----------
let guide = null, reminders = [], gview = 'now', gchan = null;
const hm = t => new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
function dayLabel(t) {
  const d = new Date(t), today = new Date(); today.setHours(0, 0, 0, 0);
  const n = Math.round((new Date(d).setHours(0, 0, 0, 0) - today) / 864e5);
  return n === 0 ? "Aujourd'hui" : n === 1 ? 'Demain' : d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}
const remId = (c, p) => c.guide + ':' + p.start;
const hasRem = (c, p) => reminders.some(r => r.id === remId(c, p));
const logo = (c, cls) => c.logo ? `<span class="logo ${cls || ''}" style="background-image:url('${esc(c.logo)}')"></span>` : `<span class="logo ${cls || ''}">${esc(c.number)}</span>`;
const chans = () => guide ? guide.channels.filter(c => c.progs.length) : [];
async function loadGuide() {
  if (!guide) $('guide').innerHTML = '<div class="spin"></div>';
  try { [guide, reminders] = await Promise.all([api('/api/guide'), api('/api/reminders')]); }
  catch (e) { $('guide').innerHTML = '<div class="empty"><b>Compagnon injoignable</b></div>'; return; }
  drawGuide();
}
async function toggleReminder(c, p) {
  const on = hasRem(c, p);
  const r = on ? await api('/api/reminders/' + encodeURIComponent(remId(c, p)), {}, 'DELETE') : await api('/api/reminders', { guide: c.guide, start: p.start });
  if (!Array.isArray(r)) { toast(r.error === 'already started' ? 'Ce programme a déjà commencé' : 'Rappel impossible'); reminders = await api('/api/reminders'); }
  else { reminders = r; toast(on ? 'Rappel supprimé' : `Rappel ${settings ? settings.reminderLead : 15} min avant · ${p.title}`, on ? null : COLORS.neutral); }
  drawGuide();
}
function tune(c) {
  api('/api/tune', { channelId: c.id }).then(r => toast(r.ok ? c.name + ' sur la télé' : 'La télé est éteinte ou injoignable')).catch(() => toast('Compagnon injoignable'));
}
function drawReminders() {
  const box = $('rems'); box.innerHTML = '';
  if (!reminders.length) return;
  box.appendChild(el('div', 'sec', `Mes rappels<small>${settings ? settings.reminderLead : 15} min avant</small>`));
  const list = el('div', 'rems'); box.appendChild(list);
  reminders.forEach(r => {
    const it = el('div', 'rem', `<div class="t"><span class="when">${esc(dayLabel(r.start))} · ${hm(r.start)}</span><b>${esc(r.title)}</b><span>${esc(r.channel)}</span></div><button aria-label="Supprimer">${I.close}</button>`);
    it.querySelector('button').onclick = async () => { reminders = await api('/api/reminders/' + encodeURIComponent(r.id), {}, 'DELETE'); toast('Rappel supprimé'); drawGuide(); };
    list.appendChild(it);
  });
}
function bellBtn(c, p) {
  const b = el('button', 'bell' + (hasRem(c, p) ? ' on' : ''), I.bell);
  b.setAttribute('aria-label', 'Rappel');
  b.onclick = e => { e.stopPropagation(); toggleReminder(c, p); };
  return b;
}
function drawGuide() {
  if (!guide) return;
  drawReminders();
  document.querySelectorAll('#gseg button').forEach(b => b.classList.toggle('on', b.dataset.g === gview));
  const list = chans(), box = $('guide'), t = Date.now();
  box.innerHTML = '';
  $('gsub').textContent = list.length ? list.length + ' chaînes de la TNT' : ' ';
  if (!list.length) { box.innerHTML = '<div class="empty"><b>Guide pas encore chargé</b>Réessaie dans une minute.</div>'; return; }
  if (gview === 'now') {
    list.forEach(c => {
      const [p, n] = c.progs, live = p.start <= t;
      const r = el('div', 'ch', `${logo(c)}<div class="t"><span class="n">${esc(c.number)} · ${esc(c.name)}</span><b>${esc(p.title)}</b>` +
        (live ? `<div class="pbar"><i style="width:${Math.min(100, (t - p.start) / (p.stop - p.start) * 100)}%"></i></div>` : '') +
        `<span class="nx">${n ? 'Puis ' + hm(n.start) + ' · ' + esc(n.title) : ''}</span></div><button class="round" aria-label="Mettre la chaîne">${I.tv}</button>`);
      r.onclick = e => { if (e.target.closest('.round')) { e.stopPropagation(); tune(c); } else openProg(c, p); };
      box.appendChild(r);
    });
  } else if (gview === 'tonight') {
    // Prime time: the first real programme (25 min or more, not the weather or the Loto) from 20:30 to 23:00, tomorrow's once it's late
    const from = new Date(); if (from.getHours() >= 23) from.setDate(from.getDate() + 1);
    from.setHours(20, 30, 0, 0);
    const to = from.getTime() + 150 * 60000;
    box.appendChild(el('div', 'sec', dayLabel(from) === "Aujourd'hui" ? 'Ce soir' : 'Demain soir'));
    const g = el('div', 'tonight'); box.appendChild(g);
    list.forEach(c => {
      const p = c.progs.find(p => p.start >= from.getTime() && p.start < to && p.stop - p.start >= 25 * 60000);
      if (!p) return;
      const card = el('div', 'tcard', `<div class="im" style="background-image:url('${esc(p.image || '')}')">${logo(c)}</div>
        <div class="t"><span class="hr">${hm(p.start)}</span><b>${esc(p.title)}</b><small>${esc([c.name, p.category].filter(Boolean).join(' · '))}</small></div>`);
      card.appendChild(bellBtn(c, p));
      card.onclick = () => openProg(c, p);
      g.appendChild(card);
    });
  } else {
    if (!gchan || !list.some(c => c.id === gchan)) gchan = list[0].id;
    const strip = el('div', 'logos'); box.appendChild(strip);
    list.forEach(c => {
      const b = el('button', c.id === gchan ? 'on' : '', `${logo(c)}<span>${esc(c.name)}</span>`);
      b.onclick = () => { gchan = c.id; drawGuide(); };
      strip.appendChild(b);
    });
    const c = list.find(x => x.id === gchan);
    const top = el('div', 'chtop', `<b>${esc(c.number)} · ${esc(c.name)}</b><button class="btn">${I.tv}Mettre</button>`);
    top.querySelector('.btn').onclick = () => tune(c);
    box.appendChild(top);
    let day = '';
    c.progs.forEach(p => {
      const d = dayLabel(Math.max(p.start, t));
      if (d !== day) { day = d; box.appendChild(el('div', 'gday', esc(d))); }
      const live = p.start <= t;
      const r = el('div', 'prog' + (live ? ' live' : ''), `<span class="hr">${live ? 'Direct' : hm(p.start)}</span><div class="t"><b>${esc(p.title)}</b><small>${esc([p.category, live ? 'jusqu\'à ' + hm(p.stop) : ''].filter(Boolean).join(' · '))}</small>` +
        (live ? `<div class="pbar"><i style="width:${Math.min(100, (t - p.start) / (p.stop - p.start) * 100)}%"></i></div>` : '') + '</div>');
      if (!live) r.appendChild(bellBtn(c, p));
      r.onclick = () => openProg(c, p);
      box.appendChild(r);
    });
    const on = strip.querySelector('.on'); if (on) strip.scrollLeft = on.offsetLeft - 16 - (strip.clientWidth - on.offsetWidth) / 2;
  }
}
document.querySelectorAll('#gseg button').forEach(b => b.onclick = () => { gview = b.dataset.g; drawGuide(); });
function openProg(c, p) {
  const t = Date.now(), live = p.start <= t;
  const meta = [dayLabel(Math.max(p.start, t)), hm(p.start) + ' – ' + hm(p.stop), p.category].filter(Boolean).join(' · ');

// ---------- Settings ----------
let settings = null;
function applyAccent() {
  // The page takes the TV theme's accent, unless it would be unreadable on black

  const ok = a && /^#[0-9a-f]{6}$/i.test(a) && lum(a) > .3;
  document.documentElement.style.setProperty('--accent', ok ? a : '#0a84ff');

}
function putSettings() {
  api('/api/settings', { providers: settings.providers.map(p => ({ key: p.key, on: p.on })), homeRedirect: settings.homeRedirect,

function drawSettings() {
  const box = $('settings'); box.innerHTML = '';

  const on = settings.providers.filter(p => p.on), off = settings.providers.filter(p => !p.on);
  // Enabled services first, in priority order; the others below, alphabetical feel kept as is

    const r = el('div', 'li' + (p.on ? '' : ' off'), `<span class="rk" style="background:${esc(p.color)};${lum(p.color) < .5 ? 'color:#fff' : ''}">${p.on ? i + 1 : ''}</span><span class="n">${esc(p.name)}</span>` +
      (p.on ? `<button class="mv" ${i === 0 ? 'disabled' : ''} aria-label="Monter">${I.up}</button><button class="mv" ${i === on.length - 1 ? 'disabled' : ''} aria-label="Descendre">${I.down}</button>` : '') +
      `<button class="tg ${p.on ? 'on' : ''}" aria-label="Activer ${esc(p.name)}"></button>`);
    const move = d => { const j = on.indexOf(p), other = on[j + d]; const l = settings.providers, a = l.indexOf(p), b = l.indexOf(other); [l[a], l[b]] = [l[b], l[a]]; putSettings(); drawSettings(); };
    const mvs = r.querySelectorAll('.mv');

  const pr = el('div', 'li', '<button class="lgbtn n">Flèches sur toutes les apps<small>Nouveau jumelage : accepte la demande sur la télé avec la vraie télécommande</small></button>');
  pr.querySelector('button').onclick = pairTv;
  tg.appendChild(pr);

// Theme: presets come from the server; "custom" = background + accent (+ light/dark), applied live on the TV
function drawThemes() {
  const box = $('themes'); box.innerHTML = '';
  const cur = settings.theme;
  applyAccent();
  settings.themes.concat([{ key: 'custom', name: 'Perso', bg: cur.bg, accent: cur.accent, light: cur.light }]).forEach(t => {
    const b = el('button', 'theme' + (cur.name === t.key ? ' on' : ''), `<i style="background:${t.accent}"></i>${esc(t.name)}`);
    b.style.cssText = `background:${t.bg};color:${t.light ? '#1d1d1f' : '#fff'}`;
    if (t.user) {
      const del = el('span', 'del', I.close);
      del.onclick = e => {
        e.stopPropagation();
        if (!confirm(`Supprimer le thème « ${t.name} » ?`)) return;
        fetch('/api/themes/' + encodeURIComponent(t.key), { method: 'DELETE' }).then(r => r.json()).then(s2 => { settings = s2; drawThemes(); });
      };
      b.appendChild(del);
    }
    b.onclick = () => {
      settings.theme = t.key === 'custom' || t.user
        ? { name: t.key, bg: t.bg, accent: t.accent, light: !!t.light } // editable: start from its own colours
        : Object.assign({}, cur, { name: t.key }); // built-in preset: keep the custom colours for later
      if (!(t.key === 'custom' || t.user)) settings.theme.accent = t.accent;
      putSettings(); drawThemes();
    };
    box.appendChild(b);
  });
  const c = $('custom');
  // The editor opens on "Perso" and on saved themes; edits to a saved theme are saved into it
  const saved = settings.themes.find(t => t.user && t.key === cur.name);
  if (cur.name !== 'custom' && !saved) { c.innerHTML = ''; return; }
  if (saved) Object.assign(cur, { bg: saved.bg, accent: saved.accent, light: !!saved.light });
  c.innerHTML = `<div class="custom">${saved ? `<div class="ed-title">Modifier « ${esc(saved.name)} »</div>` : ''}<div id="ed-bg"></div><div id="ed-accent"></div>
    <div class="lrow">Thème clair <button class="tg ${cur.light ? 'on' : ''}" id="c-light"></button></div>
    <div class="preview" id="c-prev">Aperçu<span>Sélection</span></div>
    <div class="save"><input id="c-name" maxlength="24" placeholder="Nom du thème" value="${saved ? esc(saved.name) : ''}"><button id="c-save">${saved ? 'Renommer' : 'Enregistrer'}</button></div></div>`;
  const prev = () => {
    const t = settings.theme;
    $('c-prev').style.cssText = `background:${t.bg};color:${t.light ? '#1d1d1f' : '#fff'}`;
    $('c-prev').querySelector('span').style.cssText = `background:${t.accent};color:${lum(t.accent) > 0.6 ? '#000' : '#fff'}`;
  };
  let timer = null;
  const persist = () => saved
    ? api('/api/themes/' + encodeURIComponent(saved.key), { bg: cur.bg, accent: cur.accent, light: cur.light }, 'PUT')
    : putSettings();
  const change = () => {
    if (saved) Object.assign(saved, { bg: cur.bg, accent: cur.accent, light: cur.light });
    prev(); applyAccent(); clearTimeout(timer); timer = setTimeout(persist, 250);
  };
  colorEditor($('ed-bg'), 'Fond', cur.bg, v => { cur.bg = v; change(); });
  colorEditor($('ed-accent'), 'Accent', cur.accent, v => { cur.accent = v; change(); });
  $('c-save').onclick = () => {
    const name = $('c-name').value.trim();
    if (!name) { $('c-name').focus(); return; }
    clearTimeout(timer);
    if (saved) {
      api('/api/themes/' + encodeURIComponent(saved.key), { name, bg: cur.bg, accent: cur.accent, light: cur.light }, 'PUT')
        .then(s2 => { settings = s2; drawThemes(); toast('Thème renommé'); });
      return;
    }
    const t = settings.theme;
    api('/api/themes', { name, bg: t.bg, accent: t.accent, light: t.light }).then(s2 => {
      if (s2.error) { toast(s2.error === 'too many themes' ? 'Trop de thèmes enregistrés, supprimes-en un' : 'Couleurs invalides'); return; }
      settings = s2; drawThemes(); toast('Thème enregistré');
    });
  };
  $('c-light').onclick = () => { cur.light = !cur.light; $('c-light').classList.toggle('on', cur.light); change(); };
  prev();
}

// Hue / saturation / lightness sliders, starting from the current colour (the native picker didn't)
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
  let h = 0, sat = 0;
  if (d) {
    sat = d / (1 - Math.abs(2 * l - 1));
    h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
  }
  return [Math.round(h), Math.round(sat * 100), Math.round(l * 100)];
}
function hslToHex(h, sat, l) {
  sat /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = sat * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  return '#' + [f(0), f(8), f(4)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function colorEditor(box, label, hex, onChange) {
  let [h, sat, l] = hexToHsl(hex);
  box.className = 'ced';
  box.innerHTML = `<div class="ced-head"><b>${label}</b><input class="ced-hex" maxlength="7" spellcheck="false" autocapitalize="characters" aria-label="Code hexadécimal"><i class="ced-sw"></i></div>
    <input type="range" min="0" max="360" class="r-h" aria-label="Teinte">
    <input type="range" min="0" max="100" class="r-s" aria-label="Saturation">
    <input type="range" min="0" max="100" class="r-l" aria-label="Luminosité">`;
  const [rh, rs, rl] = box.querySelectorAll('input[type=range]'); // not the hex field
  rh.value = h; rs.value = sat; rl.value = l;
  const field = box.querySelector('.ced-hex');
  let exact = hex.toLowerCase(); // a typed code is kept as is, not rounded through the sliders
  const paint = (fromField) => {
    const v = exact || hslToHex(h, sat, l);
    box.querySelector('.ced-sw').style.background = v;
    if (!fromField) field.value = v.toUpperCase();
    rh.style.background = 'linear-gradient(90deg,' + [0, 60, 120, 180, 240, 300, 360].map(x => hslToHex(x, 90, 55)).join(',') + ')';
    rs.style.background = `linear-gradient(90deg, ${hslToHex(h, 0, l)}, ${hslToHex(h, 100, l)})`;
    rl.style.background = `linear-gradient(90deg, #000, ${hslToHex(h, sat, 50)}, #fff)`;
    return v;
  };
  rh.oninput = () => { h = +rh.value; exact = null; onChange(paint()); };
  rs.oninput = () => { sat = +rs.value; exact = null; onChange(paint()); };
  rl.oninput = () => { l = +rl.value; exact = null; onChange(paint()); };
  // Hex code: accepts #RRGGBB, RRGGBB or #RGB; moves the sliders to match
  field.oninput = () => {
    let v = field.value.trim().replace(/^#?/, '#');
    if (/^#[0-9a-f]{3}$/i.test(v)) v = '#' + v.slice(1).split('').map(c => c + c).join('');
    const okHex = /^#[0-9a-f]{6}$/i.test(v);
    field.classList.toggle('bad', !okHex && field.value.length > 0);
    if (!okHex) return;
    exact = v.toLowerCase();
    [h, sat, l] = hexToHsl(exact);
    rh.value = h; rs.value = sat; rl.value = l;
    onChange(paint(true));
  };
  field.onblur = () => { field.classList.remove('bad'); paint(); };
  paint();
}

function loadSettings() { return api('/api/settings').then(s => { settings = s; applyAccent(); return s; }); }

// ---------- TV remote ----------
// Power, volume, channels, media keys and apps work everywhere; arrows / OK / Back reach every app only if the TV
// grants its pointer socket (tvs.nav === 'all'), otherwise just our own Accueil (relayed by the companion)
let tvs = null, live = null, apps = null, paused = false;
const W = window, LIVE_APP = 'com.webos.app.livetv';
function styleFor(id) {
  const s = (W.APP_STYLES || []).find(x => x.match.test(id));
  if (s) return s;
  const src = (W.SOURCES || []).find(x => x.id === id);
  if (src) return { name: src.name, word: src.name, tile: 'linear-gradient(180deg,#3a3b40,#26272b)' };
  const parts = id.split(/[.\-_]/).filter(p => !/^(com|tv|app|apps|lg|webos|prod|leanback|v\d+)$/i.test(p));
  const name = parts.sort((a, b) => b.length - a.length)[0] || id;
  return { name: name.charAt(0).toUpperCase() + name.slice(1), word: name.charAt(0).toUpperCase() + name.slice(1), tile: 'linear-gradient(180deg,#3a3b40,#26272b)' };
}
// Same faces as the TV tiles, scaled to a phone tile (k = phone tile width / 240 px TV tile)
function tileFace(s, k) {
  if (s.logo) return `<img src="/tv/${esc(s.logo)}" alt="" style="${s.logoWidth ? `width:${s.logoWidth}%` : `height:${Math.round(70 * (s.logoScale || 1) * k)}px`}">`;
  const w = s.word || s.name;
  return `<span class="word" style="color:${s.fg || '#fff'};font-size:${Math.round(Math.min(46, 300 / Math.max(4, w.length)) * k)}px">${esc(w)}</span>`;
}
const appTile = (id, k) => { const s = styleFor(id); return `<div class="apptile" style="background:${s.tile}">${tileFace(s, k)}</div>`; };
function remote(cmd, extra) {
  return api('/api/remote', Object.assign({ cmd }, extra || {})).then(r => {
    if (!r.ok) toast(cmd === 'on' ? 'Impossible d\'envoyer le signal' : 'La télé est éteinte ou injoignable');
    return r;
  }).catch(() => toast('Compagnon injoignable'));
}
async function loadTv() {
  try {
    const [t, a] = await Promise.all([api('/api/tv'), apps ? Promise.resolve(apps) : api('/api/apps')]);
    tvs = t; apps = a;
    live = t.on && t.app === LIVE_APP ? await api('/api/live').catch(() => null) : null;
  } catch (e) { tvs = null; }
  drawTv();
}
function drawTv() {
  const on = tvs && tvs.on, cur = tvs ? tvs.app : '';
  $('tvsub').textContent = !tvs ? 'Compagnon injoignable' : on ? 'Allumée' + (cur && cur !== 'com.yoan.home' ? ' · ' + (cur === LIVE_APP ? 'TV en direct' : styleFor(cur).name) : ' · Accueil') : 'Éteinte';
  const now = $('now');
  now.className = 'now'; now.style.backgroundImage = ''; now.onclick = null;
  if (!on) {
    now.className = 'now off';
    now.innerHTML = `<b>La télé est éteinte</b><p>L'allumage à distance marche si « Allumer avec le Wi-Fi » est activé sur la télé.</p><button class="bigbtn">${I.power}Allumer</button>`;
    now.querySelector('button').onclick = () => remote('on').then(r => { if (r && r.ok) toast('Signal envoyé, la télé s\'allume…'); });
  } else if (live && live.now) {
    const p = live.now, c = live.channel || {}, t = Date.now();
    if (p.image) { now.classList.add('img'); now.style.backgroundImage = `url('${p.image.replace(/'/g, '%27')}')`; }
    now.innerHTML = `${c.logo ? `<span class="logo" style="background-image:url('${esc(c.logo)}')"></span>` : ''}<div class="t"><span class="k">En direct · ${esc(c.number || '')} ${esc(c.name || '')}</span><b>${esc(p.title)}</b>
      <div class="pbar"><i style="width:${Math.max(0, Math.min(100, (t - p.start) / (p.stop - p.start) * 100))}%"></i></div>
      <small>${live.next ? 'Puis ' + hm(live.next.start) + ' · ' + esc(live.next.title) : 'Jusqu\'à ' + hm(p.stop)}</small></div>`;
    now.onclick = () => { const g = guide && guide.channels.find(x => x.name === c.name); openProg(g || { name: c.name, number: c.number, logo: c.logo, id: '' }, p); };
  } else {
    const id = cur || 'com.yoan.home', s = id === 'com.yoan.home' ? { name: 'Accueil' } : styleFor(id);
    now.innerHTML = (id === 'com.yoan.home' ? `<div class="apptile" style="background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center">${I.home}</div>` : appTile(id, .4)) +
      `<div class="t"><span class="k">À l'écran</span><b>${esc(s.name)}</b></div>`;
    const ic = now.querySelector('.apptile > svg'); if (ic) ic.style.cssText = 'width:26px;height:26px';
  }
  drawScreen();
  paintRemote(on, cur);
  // Apps (the home list from the TV) and sources
  // My streaming services first (as on the TV), then the home list
  const mine = settings ? settings.providers.filter(p => p.on && p.app).map(p => p.app) : [];
  const list = mine.concat((apps && apps.apps) || W.DEFAULT_APPS || []).filter((id, i, l) => l.indexOf(id) === i);
  $('apps').innerHTML = list.map(id => `<button class="app ${id === cur ? 'cur' : ''}" data-id="${esc(id)}">${appTile(id, .45)}<span>${esc(styleFor(id).name)}</span></button>`).join('');
  $('srcs').innerHTML = (W.SOURCES || []).filter(s => !/settings/.test(s.id)).map(s => `<button class="chip ${s.id === cur ? 'cur' : ''}" data-id="${esc(s.id)}">${s.id === LIVE_APP ? 'TV en direct' : esc(s.name)}</button>`).join('');
  document.querySelectorAll('#apps [data-id], #srcs [data-id]').forEach(b => b.onclick = () => {
    if (!on) { toast('La télé est éteinte'); return; }
    remote('launch', { id: b.dataset.id }).then(x => { if (x && x.ok) toast(styleFor(b.dataset.id).name + ' sur la télé'); });
  });
}
// Built once (a redraw in the middle of a held button would lose its release), then only repainted
const HOME_APP = 'com.yoan.home';
const navOk = () => tvs && tvs.on && (tvs.nav === 'all' || tvs.app === HOME_APP);
function dpadHtml() {
  return `<div class="dpad"><button class="dp up" data-k="up" aria-label="Haut">${I.up}</button><button class="dp left" data-k="left" aria-label="Gauche">${I.left}</button>
    <button class="dp right" data-k="right" aria-label="Droite">${I.right}</button><button class="dp down" data-k="down" aria-label="Bas">${I.down}</button>
    <button class="ok" data-k="ok">OK</button></div>`;
}
const volRocker = `<div class="rocker"><button data-h="volumeUp" aria-label="Volume +">${I.plus}</button><span>VOL</span><em class="vol"></em><button data-h="volumeDown" aria-label="Volume −">${I.minus}</button></div>`;
function buildRemote() {
  $('remote').innerHTML = `<div class="rtop"><button class="key sm" data-c="mute" aria-label="Muet"><i>${I.mute}</i></button><span class="hint"></span>
      <button class="key sm power" data-c="off" aria-label="Éteindre"><i>${I.power}</i></button></div>
    <div class="rrow">${volRocker}${dpadHtml()}
      <div class="rocker"><button data-c="channelUp" aria-label="Chaîne suivante">${I.up}</button><span>CH</span><em class="ch"></em><button data-c="channelDown" aria-label="Chaîne précédente">${I.down}</button></div></div>
    <div class="rbar"><button class="key" data-k="back"><i>${I.ret}</i>Retour</button><button class="key" data-c="home"><i>${I.home}</i>Accueil</button>
      <button class="key" data-c="rewind"><i>${I.rew}</i>Reculer</button><button class="key" data-c="pp"><i>${I.pp}</i>Lecture</button>
      <button class="key" data-c="fastForward"><i>${I.ff}</i>Avancer</button></div>`;
  $('fsctl').innerHTML = `${volRocker.replace('<span>VOL</span><em class="vol"></em>', `<button data-c="mute" aria-label="Muet">${I.mute}</button>`)}
    <div class="side">${dpadHtml()}<div class="row"><button class="key" data-k="back" aria-label="Retour"><i>${I.ret}</i></button>
      <button class="key" data-c="home" aria-label="Accueil"><i>${I.home}</i></button><button class="key" data-c="pp" aria-label="Lecture / pause"><i>${I.pp}</i></button></div></div>`;
  [$('remote'), $('fsctl')].forEach(root => {
    root.querySelectorAll('[data-k]').forEach(b => holdable(b, b.dataset.k !== 'ok' && b.dataset.k !== 'back', () => navKey(b.dataset.k)));
    root.querySelectorAll('[data-h]').forEach(b => holdable(b, true, () => remote(b.dataset.h)));
    root.querySelectorAll('[data-c]').forEach(b => b.onclick = e => { e.stopPropagation(); buzz(); command(b.dataset.c); });
  });
}
function paintRemote(on, cur) {
  $('remote').classList.toggle('dis', !on);
  const vol = tvs && tvs.volume != null ? tvs.volume : null, muted = tvs && tvs.muted, nav = navOk();
  document.querySelectorAll('[data-c=mute]').forEach(b => b.classList.toggle('on', !!muted));
  document.querySelectorAll('.remote .vol').forEach(e => e.textContent = muted ? '—' : vol == null ? '' : vol);
  document.querySelectorAll('.remote .ch').forEach(e => e.textContent = tvs && tvs.channel && cur === LIVE_APP ? tvs.channel.number : '');
  document.querySelectorAll('.dpad').forEach(d => d.classList.toggle('dis', !nav));
  document.querySelector('.remote .hint').textContent = on && !nav ? 'Flèches et OK : dans l\'Accueil seulement' : '';
}
function command(c) {
  const cur = tvs ? tvs.app : '';
  if (c === 'home') return remote('launch', { id: HOME_APP });
  if (c === 'pp') { paused = !paused; return remote(paused ? 'pause' : 'play'); }
  if (c === 'off') return toast('Éteindre la télé ?', COLORS.pass, 'Éteindre', () => remote('off'));
  if ((c === 'channelUp' || c === 'channelDown') && cur !== LIVE_APP) return remote('launch', { id: LIVE_APP });
  remote(c);
}
const buzz = () => { if (navigator.vibrate) navigator.vibrate(8); };
// Keys go one after another, in order, and the live picture refreshes faster for a moment to show the result
let keyChain = Promise.resolve();
function navKey(k) {
  if (!navOk()) {
    if (tvs && tvs.on) toast('Les flèches ne marchent que dans l\'Accueil', null, 'Ouvrir l\'Accueil', () => remote('launch', { id: HOME_APP }));
    return;
  }
  keyChain = keyChain.then(() => api('/api/remote', { cmd: 'key', key: k })).then(r => { if (!r.ok) loadTv(); }).catch(() => {});
  boostScreen();
}
// Fires on release (so starting a scroll on the remote presses nothing); held, it repeats like a real remote
function holdable(b, repeat, fire) {
  let timer = null, held = false, x = 0, y = 0;
  const stop = () => { clearTimeout(timer); clearInterval(timer); timer = null; b.classList.remove('press'); };
  b.addEventListener('pointerdown', e => {
    e.stopPropagation(); held = false; x = e.clientX; y = e.clientY; b.classList.add('press');
    if (repeat) timer = setTimeout(() => { held = true; buzz(); fire(); timer = setInterval(fire, 130); }, 380);
  });
  b.addEventListener('pointermove', e => { if (timer && !held && Math.abs(e.clientX - x) + Math.abs(e.clientY - y) > 14) { stop(); x = 1e9; } });
  b.addEventListener('pointerup', e => { const was = held, moved = x === 1e9; stop(); if (!was && !moved) { buzz(); fire(); } });
  b.addEventListener('pointercancel', () => { stop(); x = 1e9; });
  b.addEventListener('pointerleave', stop);
  b.addEventListener('click', e => e.stopPropagation());
}
buildRemote();

function pairTv() {
  api('/api/pair', {}).then(r => {
    if (!r.ok) return toast('La télé est éteinte ou injoignable');
    toast('Accepte la demande sur la télé (vraie télécommande)');
    const t0 = Date.now();
    const poll = () => api('/api/tv').then(t => {
      tvs = t;
      if (t.pair === 'waiting' && Date.now() - t0 < 90000) return setTimeout(poll, 2000);
      toast({ ok: 'C\'est bon : flèches et OK sur toutes les apps', refused: 'La télé refuse toujours les flèches hors de l\'Accueil', failed: 'Jumelage non accepté sur la télé' }[t.pair] || 'Jumelage terminé',
        t.pair === 'ok' ? COLORS.like : COLORS.pass);
    }).catch(() => setTimeout(poll, 3000));
    setTimeout(poll, 2000);
  }).catch(() => toast('Compagnon injoignable'));
}

// ---------- TV screen ----------
// The companion returns one capture per request; ask again once a frame is drawn, only while someone is looking
let shotOn = false, shotUrl = null, shotFails = 0, shotWait = null, shotNext = null, boostUntil = 0;
// Right after a key press: next frame now, then as fast as the TV gives them for a few seconds
function boostScreen() {
  boostUntil = Date.now() + 3000;
  if (shotWait && shotNext) { clearTimeout(shotWait); shotWait = null; shotNext(); }
}
function screenWanted() { return document.visibilityState === 'visible' && (tab === 'tv' || !$('screenfs').hidden) && tvs && tvs.on; }
function screenLoop() {
  if (shotOn || !screenWanted()) return;
  shotOn = true;
  const box = $('screen'), msg = box.querySelector('.msg');
  const next = shotNext = () => {
    shotWait = null;
    if (!screenWanted()) { shotOn = false; return; }
    fetch('/api/screen?t=' + Date.now()).then(r => { if (!r.ok) throw r; return r.blob(); }).then(b => {
      const url = URL.createObjectURL(b);
      document.querySelectorAll('#screen img, #screenfs img').forEach(i => i.src = url);
      if (shotUrl) setTimeout(URL.revokeObjectURL, 1000, shotUrl);
      shotUrl = url; shotFails = 0;
      box.classList.remove('stale'); msg.hidden = true;
      shotWait = setTimeout(next, Date.now() < boostUntil || !$('screenfs').hidden ? 60 : 300);
    }).catch(() => {
      // Keep the last frame, retry more and more slowly
      shotFails++;
      box.classList.add('stale');
      if (!shotUrl) { msg.hidden = false; msg.textContent = 'Écran indisponible'; }
      shotWait = setTimeout(next, Math.min(5000, 500 * shotFails));
    });
  };
  next();
}
function drawScreen() {
  $('screen').hidden = !(tvs && tvs.on);
  screenLoop();
}
// Full screen, landscape; the back button closes it (history entry, as for the sheet)
function screenFull(open) {
  const fs = $('screenfs');
  if (open === !fs.hidden) return;
  fs.hidden = !open;
  document.body.classList.toggle('fs', open);
  if (open) {
    fsControls(true);
    history.pushState({ screen: 1 }, '');
    const el = document.documentElement;
    const p = el.requestFullscreen ? el.requestFullscreen() : null;
    if (p) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {});
    screenLoop();
  } else {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    if (history.state && history.state.screen) history.back();
  }
}
$('screen').onclick = () => screenFull(true);
// Controls fade out after a few seconds without a touch, a tap on the picture brings them back
let fsTimer = null;
function fsControls(show) {
  clearTimeout(fsTimer);
  $('screenfs').classList.toggle('ctl', show);
  if (show) fsTimer = setTimeout(() => fsControls(false), 5000);
}
$('screenfs').onclick = () => fsControls(!$('screenfs').classList.contains('ctl'));
$('fsctl').addEventListener('pointerdown', () => fsControls(true));
$('fsctl').addEventListener('click', e => e.stopPropagation());
document.querySelector('#screenfs .fsclose').onclick = e => { e.stopPropagation(); screenFull(false); };
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) screenFull(false); });
window.addEventListener('popstate', () => screenFull(false));

$('gear').onclick = () => show('settings');
$('sback').onclick = () => show('tv');

// ---------- Tabs ----------
const TABS = [['tv', 'Télé', I.tTv], ['guide', 'Guide TV', I.tGuide], ['rate', 'Découvrir', I.tDiscover], ['search', 'Rechercher', I.tSearch], ['history', 'Mes notes', I.tList]];
const VIEWS = TABS.map(t => t[0]).concat(['settings']);
let tab = null;
const scrolls = {};
$('tabs').innerHTML = TABS.map(([k, n, ic]) => `<button data-v="${k}">${ic}${n}</button>`).join('');
function show(v) {
  if (!VIEWS.includes(v)) v = 'tv';
  if (tab === v) {
    // Tapping the active tab scrolls back to the top (and leaves a genre/person list)
    if (v === 'search' && browsing) { browsing = null; search(); }
    window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  if (tab) scrolls[tab] = window.scrollY;
  tab = v; document.body.dataset.tab = v;
  // Settings live under the Télé tab
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === (v === 'settings' ? 'tv' : v)));
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  window.scrollTo(0, scrolls[v] || 0);
  history.replaceState(history.state, '', '#' + v);
  if (v === 'history') loadHistory();
  if (v === 'settings') loadSettings().then(drawSettings);
  if (v === 'guide') loadGuide();
  if (v === 'tv') loadTv();
  if (v === 'rate' && !queue.length) fill();
  if (v === 'search' && !$('q').value && !browsing) setTimeout(() => $('q').focus(), 50);
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => show(b.dataset.v));

// The TV may set or clear reminders too (and the server drops past ones)
if (window.EventSource) {
  const ev = new EventSource('/api/events');
  ev.addEventListener('reminders', () => { if (tab === 'guide') api('/api/reminders').then(l => { reminders = l; drawGuide(); }); });
  // Power, app on screen, volume, channel
  let tvt = null;
  ev.addEventListener('tv', () => { clearTimeout(tvt); tvt = setTimeout(() => { if (tab === 'tv') loadTv(); }, 250); });
}
// The programme on air changes while the page stays open
setInterval(() => { if (tab === 'tv' && document.visibilityState === 'visible') loadTv(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && tab === 'tv') loadTv(); });

loadSettings().catch(() => {});
loadCount().catch(() => {});
show(location.hash.slice(1));
// Installable app (HTTPS only: through Tailscale, not on the plain LAN address)
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
