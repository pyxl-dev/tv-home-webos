name: Dépôt public
on:
  pull_request:
  push:
    branches: [main]
jobs:
  public-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Garde (fichiers suivis, messages de la PR)
        run: |
          bun scripts/public-guard.ts tree
          if [ "${{ github.event_name }}" = pull_request ]; then git log --format='%an <%ae>%n%B' origin/${{ github.base_ref }}..HEAD | bun scripts/public-guard.ts text; fi
